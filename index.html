<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muffin · Заказ кофе</title>
<meta name="description" content="Внутреннее приложение заказа кофе для офиса: сотрудники заказывают, бариста Muffin видит все заказы и статусы в реальном времени.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B8672A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B140E" media="(prefers-color-scheme: dark)">
<script>
  // Applied before first paint so a stored theme/language preference never
  // flashes the wrong one for a moment - see muffin_theme/muffin_lang
  // handling in app.js (the actual text still comes from there; this just
  // sets the <html lang> attribute early for correctness/a11y).
  (function(){
    try{
      var theme = localStorage.getItem('muffin_theme');
      if(theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      var lang = localStorage.getItem('muffin_lang');
      if(lang === 'ru' || lang === 'az') document.documentElement.lang = lang;
    }catch(e){}
  })();
</script>

<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muffin">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root">
  <noscript>Для работы приложения включите JavaScript.</noscript>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
