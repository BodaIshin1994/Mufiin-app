name: Reset user password (admin utility)

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "Firebase Auth UID whose password to reset"
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reset password via Admin SDK
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          PROJECT_ID: '${{ vars.FIREBASE_PROJECT_ID }}'
          TARGET_UID: '${{ inputs.uid }}'
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm install firebase-admin
          node -e "
            const admin = require('firebase-admin');
            const crypto = require('crypto');
            admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: process.env.PROJECT_ID });
            const newPassword = crypto.randomBytes(9).toString('base64').replace(/[+/=]/g,'x');
            admin.auth().updateUser(process.env.TARGET_UID, { password: newPassword })
              .then(user => {
                console.log('Password reset for', user.email || user.uid);
                console.log('NEW_PASSWORD=' + newPassword);
                process.exit(0);
              })
              .catch(err => { console.error(err); process.exit(1); });
          "
          rm -f /tmp/sa.json